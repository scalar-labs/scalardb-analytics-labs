[versions]
assertj = "3.27.7"
arrow-java = "19.0.0"
checker-framework = "3.53.1"
# One DuckDB release: the JDBC binding, the product extension, and the scanner extensions must all
# target this core version. The scanner entries pin the upstream commits DuckDB builds them from.
duckdb = "1.5.6"
duckdb-jdbc = "1.5.6.0"
duckdb-mysql-scanner = "99c2e091b153b7f1cbd449988332232e75684b41"
duckdb-postgres-scanner = "318dabb2474fc3789b0199301a2e661e19c1b4fc"
error-prone = "2.50.0"
error-prone-plugin = "5.1.1"
jackson = "2.22.1"
jspecify = "1.0.0"
junit = "5.13.1"
junit-platform = "1.13.1"
nullaway = "0.14.2"
picocli = "4.7.7"
spotless = "8.10.4"
google-java-format = "1.36.1"
grpc = "1.83.1"
mariadb = "3.5.10"
postgresql = "42.7.13"
proto-google-common-protos = "2.74.0"
spring-boot = "4.1.0"
testcontainers = "1.21.4"

[libraries]
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
arrow-c-data = { module = "org.apache.arrow:arrow-c-data", version.ref = "arrow-java" }
arrow-memory-unsafe = { module = "org.apache.arrow:arrow-memory-unsafe", version.ref = "arrow-java" }
arrow-vector = { module = "org.apache.arrow:arrow-vector", version.ref = "arrow-java" }
checker-qual = { module = "org.checkerframework:checker-qual", version.ref = "checker-framework" }
duckdb-jdbc = { module = "org.duckdb:duckdb_jdbc", version.ref = "duckdb-jdbc" }
error-prone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "error-prone" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
grpc-bom = { module = "io.grpc:grpc-bom", version.ref = "grpc" }
grpc-api = { module = "io.grpc:grpc-api" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf" }
grpc-services = { module = "io.grpc:grpc-services" }
grpc-stub = { module = "io.grpc:grpc-stub" }
mariadb-java-client = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
proto-google-common-protos = { module = "com.google.api.grpc:proto-google-common-protos", version.ref = "proto-google-common-protos" }
slf4j-nop = { module = "org.slf4j:slf4j-nop" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-jdbc = { module = "org.springframework.boot:spring-boot-jdbc" }
spring-data-jdbc = { module = "org.springframework.data:spring-data-jdbc" }
hikaricp = { module = "com.zaxxer:HikariCP" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-mysql = { module = "org.testcontainers:mysql", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }

[plugins]
dependency-license-report = { id = "com.github.jk1.dependency-license-report", version = "3.1.4" }
error-prone = { id = "net.ltgt.errorprone", version.ref = "error-prone-plugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

